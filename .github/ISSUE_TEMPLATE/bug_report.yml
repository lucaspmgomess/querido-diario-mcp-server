name: Bug report
description: Report reproducible incorrect behavior in the MCP server
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or personal data. For security vulnerabilities, follow SECURITY.md instead of opening a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: For example, 0.1.0 or the commit SHA.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      description: Claude Desktop, Claude Code, Cursor, Codex, another client, or direct SDK usage.
      placeholder: "Claude Code"

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Configure the server...
        2. Call search_gazettes with...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, uv version, and any relevant environment details.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, personal data and other sensitive information before pasting logs.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
